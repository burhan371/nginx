
# ==========================================
# NGINX LOAD BALANCER - AIVEN
# ==========================================

# Runtime DNS resolution
resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
resolver_timeout 5s;

# ==========================================
# BACKEND POOL - ROUND ROBIN
# ==========================================
upstream backend_servers {
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
}

# ==========================================
# PUBLIC LOAD BALANCER
# ==========================================
server {
    listen 8080;
    server_name _;

    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        proxy_pass http://backend_servers;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Retry the other backend on proxy failures
        proxy_next_upstream error timeout
                            http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

# ==========================================
# BACKEND 1 - AIVEN APPLICATION 1
# ==========================================
server {
    listen 127.0.0.1:8081;

    set $backend_host
        01a11fde-4c59-7936-8117-300ead2a472e-3000.amer-1.aiven.app;

    location / {
        proxy_pass https://$backend_host;

        proxy_http_version 1.1;

        # TLS and SNI
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate
            /etc/ssl/certs/ca-certificates.crt;

        # Aiven hostname routing
        proxy_set_header Host $backend_host;

        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        add_header X-Backend "backend-1" always;
    }
}

# ==========================================
# BACKEND 2 - AIVEN APPLICATION 2
# ==========================================
server {
    listen 127.0.0.1:8082;

    set $backend_host
        01a12006-47ba-72bf-8cfd-081f6d97ab76-3000.amer-1.aiven.app;

    location / {
        proxy_pass https://$backend_host;

        proxy_http_version 1.1;

        # TLS and SNI
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate
            /etc/ssl/certs/ca-certificates.crt;

        # Aiven hostname routing
        proxy_set_header Host $backend_host;

        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        add_header X-Backend "backend-2" always;
    }
}
