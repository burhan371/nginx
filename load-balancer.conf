
# Backend server pool
upstream backend_servers {
    # Round Robin (default)
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
}

# Public-facing NGINX load balancer
server {
    listen 80;
    server_name _;

    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        proxy_pass http://backend_servers;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# Demo backend server 1
server {
    listen 127.0.0.1:8081;

    location / {
        default_type text/plain;
        add_header X-Backend "backend-1" always;
        return 200 "Response from Backend 1\n";
    }
}

# Demo backend server 2
server {
    listen 127.0.0.1:8082;

    location / {
        default_type text/plain;
        add_header X-Backend "backend-2" always;
        return 200 "Response from Backend 2\n";
    }
}
