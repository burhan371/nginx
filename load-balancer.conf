# ==========================================
# NGINX LOAD BALANCER - BROWSERLESS ON AIVEN
# ==========================================

resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
resolver_timeout 5s;

# WebSocket upgrade when requested, keepalive otherwise
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ==========================================
# BACKEND POOL - LEAST CONNECTIONS
# ==========================================
upstream backend_servers {
    zone backend_servers 64k;      # share state across workers
    least_conn;                    # sessions are long-lived, so balance on open connections

    server 127.0.0.1:8081 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=15s;

    keepalive 32;
}

# ==========================================
# PUBLIC LOAD BALANCER
# ==========================================
server {
    listen 8080 backlog=1024 reuseport;
    server_name _;

    client_max_body_size 50m;      # large HTML/script payloads for /pdf, /screenshot, /function
    client_body_buffer_size 1m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        proxy_pass http://backend_servers;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;   # keep above browserless TIMEOUT

        # Fail over when a backend is unreachable or its queue is full (429).
        # No retry on timeout/504: the job may already be running.
        proxy_next_upstream error http_429 http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}

# ==========================================
# BACKEND 1 - AIVEN APPLICATION 1
# ==========================================
server {
    listen 127.0.0.1:8081;

    client_max_body_size 50m;

    set $backend_host
        01a11fde-4c59-7936-8117-300ead2a472e-3000.amer-1.aiven.app;

    location / {
        proxy_pass https://$backend_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # TLS and SNI
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate
            /etc/ssl/certs/ca-certificates.crt;

        # Aiven hostname routing
        proxy_set_header Host $backend_host;

        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;

        # Outer layer already buffers; stream straight through here
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header X-Backend "backend-1" always;
    }
}

